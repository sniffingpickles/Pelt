# Push a tag like v1.0.1 to build the addon zip and create the GitHub release.
# To also upload to CurseForge: add "## X-Curse-Project-ID: <id>" to Pelt.toc
# and a CF_API_TOKEN repository secret (https://authors.curseforge.com/#/settings/api-tokens).
name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
